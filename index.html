<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acompañando</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <main id="login">

    <!-- Logo + título -->
    <header>
      <img src="/img/ChatGPT Image 7 sept 2026, 08_02_53 p.m..png" alt="Logo de la app">
      <h1>Iniciar sesión</h1>
    </header>

    <!-- Formulario -->
    <section>
      <div>
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" placeholder="Correo electrónico" autocomplete="email">
      </div>

      <div>
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña" autocomplete="current-password">
      </div>

      <div>
        <input type="checkbox" id="recordarme" name="recordarme" checked>
        <label for="recordarme">Recordarme</label>
        <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
      </div>

      <a href="/html/home.html"><button type="button">Iniciar sesión →</button></a>

      <hr>

      <a href="/html/singup.html"><button type="button">Crear cuenta</button></a>
    </section>

    <!-- Términos -->
    <footer>
      <p>Al continuar, aceptas nuestros <a href="/html/terminos.html">términos y condiciones</a></p>
    </footer>

  </main>

</body>
</html>
